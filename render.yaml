services:
  - type: web
    name: cit-scheduler-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cit_scheduler
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: SOLVER_TIME_LIMIT_SECONDS
        value: "60"
      - key: SOLVER_WORKERS
        value: "2"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: ENVIRONMENT
        value: production
